<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Моя неделя</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1: #eef2fb;
    --bg-2: #f7eef7;
    --text: #1c1c1e;
    --text-soft: rgba(28,28,30,0.5);
    --text-faint: rgba(28,28,30,0.38);
    --glass-fill: rgba(255,255,255,0.55);
    --glass-fill-strong: rgba(255,255,255,0.72);
    --glass-border: rgba(255,255,255,0.6);
    --glass-shadow: rgba(31,38,73,0.10);
    --accent: #0A84FF;
    --accent-2: #5E5CE6;
    --done: #34C759;
    --done-soft: rgba(52,199,89,0.14);
    --divider: rgba(60,60,67,0.1);
    --today: #E2703F;
    --today-soft: rgba(226,112,63,0.14);
    --today-glow: rgba(226,112,63,0.35);
    --pink: #FF5C8A;
    --pink-bg: rgba(255,92,138,0.13);
    --green: #8FCB3E;
    --green-bg: rgba(143,203,62,0.16);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg-1: #1c1c2a;
      --bg-2: #221c2a;
      --text: #f2f2f7;
      --text-soft: rgba(242,242,247,0.55);
      --text-faint: rgba(242,242,247,0.38);
      --glass-fill: rgba(255,255,255,0.08);
      --glass-fill-strong: rgba(255,255,255,0.12);
      --glass-border: rgba(255,255,255,0.14);
      --glass-shadow: rgba(0,0,0,0.35);
      --accent: #0A84FF;
      --accent-2: #7D7AFF;
      --done: #30D158;
      --done-soft: rgba(48,209,88,0.18);
      --divider: rgba(255,255,255,0.08);
      --today: #FF8F5E;
      --today-soft: rgba(255,143,94,0.16);
      --today-glow: rgba(255,143,94,0.4);
      --pink: #FF6E9C;
      --pink-bg: rgba(255,110,156,0.18);
      --green: #A3DB55;
      --green-bg: rgba(163,219,85,0.2);
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html, body{ height:100%; }
  body{
    margin:0;
    font-family:'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    background:
      radial-gradient(120% 60% at 15% -10%, var(--bg-2) 0%, transparent 55%),
      radial-gradient(120% 60% at 85% 0%, var(--bg-1) 0%, transparent 60%),
      var(--bg-1);
    min-height:100vh;
    padding: env(safe-area-inset-top,16px) 14px calc(env(safe-area-inset-bottom,16px) + 40px);
  }

  header{
    text-align:center;
    margin: 10px 0 18px;
  }
  header h1{
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.2px;
    margin: 0 0 4px;
  }
  header p{
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-soft);
    margin: 0;
    letter-spacing: 0.1px;
  }
  #week-range{
    font-weight: 600;
    color: var(--text);
  }
  .dot-sep{
    margin: 0 5px;
    color: var(--text-faint);
  }

  .commute-note{
    max-width: 520px;
    margin: 0 auto 16px;
    padding: 11px 16px;
    border-radius: 18px;
    text-align:center;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-soft);
    background: var(--glass-fill);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid var(--glass-border);
    box-shadow: 0 8px 20px -12px var(--glass-shadow);
  }

  .week{
    max-width: 520px;
    margin: 0 auto;
    display:flex;
    flex-direction:column;
    gap: 12px;
  }

  .day{
    border-radius: 22px;
    padding: 14px 16px 12px;
    background: var(--glass-fill);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    border: 1px solid var(--glass-border);
    box-shadow: 0 10px 28px -18px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.25);
    position: relative;
    transition: background 0.3s ease;
  }
  .day.today{
    background: linear-gradient(180deg, var(--today-soft) 0%, var(--glass-fill-strong) 70px);
    box-shadow: 0 0 0 2.5px var(--today), 0 0 22px -4px var(--today-glow), 0 12px 30px -16px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.3);
  }

  .day-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 8px;
  }
  .day-name{
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.1px;
    display:flex;
    align-items:center;
    gap: 7px;
  }
  .today-dot{
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--today);
    box-shadow: 0 0 0 4px var(--today-soft);
  }
  .day-progress{
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-soft);
    background: var(--glass-fill-strong);
    padding: 3px 9px;
    border-radius: 20px;
    border: 1px solid var(--glass-border);
  }
  .day.today .day-progress{
    color: var(--today);
    border-color: var(--today-soft);
  }

  .items{
    display:flex;
    flex-direction:column;
  }
  .item{
    display:flex;
    align-items:center;
    gap: 12px;
    cursor:pointer;
    user-select:none;
    padding: 8px 4px;
    border-bottom: 1px solid var(--divider);
  }
  .item:last-child{
    border-bottom: none;
  }

  .check{
    flex: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1.6px solid rgba(120,120,140,0.35);
    background: rgba(255,255,255,0.15);
    position: relative;
    transition: all 0.25s cubic-bezier(.4,0,.2,1);
  }
  .item.done .check{
    border-color: transparent;
    background: linear-gradient(135deg, var(--done), #30b552);
    box-shadow: 0 2px 8px -1px var(--done-soft);
    transform: scale(1.03);
  }
  .item.done .check::after{
    content:"";
    position:absolute;
    left: 6.5px; top: 3px;
    width: 5px; height: 9px;
    border-right: 2px solid white;
    border-bottom: 2px solid white;
    transform: rotate(40deg);
  }

  .label{
    font-size: 14.5px;
    font-weight: 500;
    line-height: 1.3;
    flex: 1;
    display:flex;
    align-items:center;
  }
  .item.done .label{
    color: var(--text-soft);
  }

  .cat-dot{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-right: 8px;
    flex: none;
  }
  .cat-dot.sport{ background: var(--accent); }
  .cat-dot.thesis{ background: var(--pink); }
  .cat-dot.english{ background: var(--green); }

  /* de-emphasized household / small tasks */
  .item.cat-home .check{
    width: 18px;
    height: 18px;
    border-width: 1.3px;
    opacity: 0.75;
  }
  .item.cat-home .label{
    font-size: 13px;
    font-weight: 400;
    color: var(--text-faint);
  }
  .item.cat-home.done .label{
    color: var(--text-faint);
  }
  .item.cat-home.done .check{
    background: linear-gradient(135deg, rgba(52,199,89,0.7), rgba(48,181,82,0.7));
    box-shadow: none;
  }

  .tag{
    display:inline-block;
    font-size: 10px;
    font-weight: 600;
    border-radius: 8px;
    padding: 2px 7px;
    margin-left: 7px;
    vertical-align: middle;
    letter-spacing: 0.1px;
  }
  .tag.tag-english{ color: var(--green); background: var(--green-bg); }
  .tag.tag-thesis{ color: var(--pink); background: var(--pink-bg); }

  footer{
    max-width: 520px;
    margin: 20px auto 0;
    text-align:center;
  }
  .reset-btn{
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-soft);
    background: var(--glass-fill);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    padding: 9px 18px;
    cursor:pointer;
  }
  .reset-btn:active{
    transform: scale(0.97);
  }

  .loading{
    text-align:center;
    color: var(--text-soft);
    font-size: 13px;
    font-weight: 500;
    margin-top: 40px;
  }
</style>
</head>
<body>

<header>
  <h1>Моя неделя</h1>
  <p><span id="week-range"></span><span class="dot-sep">·</span><span id="week-progress">загрузка…</span></p>
</header>

<div class="commute-note">в дороге · испанский, подкасты</div>

<div class="week" id="week"></div>

<footer>
  <button class="reset-btn" id="reset-btn">Сбросить неделю</button>
</footer>

<script>
// --- Telegram Mini App init ---
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) {
  tg.ready();
  tg.expand();
  try {
    tg.setHeaderColor(tg.colorScheme === 'dark' ? '#1c1c2a' : '#eef2fb');
    tg.setBackgroundColor(tg.colorScheme === 'dark' ? '#1c1c2a' : '#eef2fb');
  } catch(e) {}
}

// --- Week date range ---
function getWeekRangeLabel() {
  const now = new Date();
  const dow = now.getDay(); // 0 Sun..6 Sat
  const diffToMonday = (dow === 0 ? -6 : 1 - dow);
  const monday = new Date(now);
  monday.setDate(now.getDate() + diffToMonday);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);

  const dayNum = d => d.toLocaleDateString('ru-RU', { day: 'numeric' });
  const monthName = d => d.toLocaleDateString('ru-RU', { month: 'long' });

  if (monthName(monday) === monthName(sunday)) {
    return `${dayNum(monday)}–${dayNum(sunday)} ${monthName(sunday)}`;
  }
  return `${dayNum(monday)} ${monthName(monday)} – ${dayNum(sunday)} ${monthName(sunday)}`;
}

// --- Storage layer: Telegram CloudStorage with localStorage fallback ---
const STORAGE_KEY = 'week-tracker-state';

function storageGet() {
  return new Promise(resolve => {
    if (tg && tg.CloudStorage) {
      tg.CloudStorage.getItem(STORAGE_KEY, (err, value) => {
        if (err || !value) { resolve({}); return; }
        try { resolve(JSON.parse(value)); } catch(e) { resolve({}); }
      });
    } else {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        resolve(raw ? JSON.parse(raw) : {});
      } catch(e) { resolve({}); }
    }
  });
}

function storageSet(state) {
  const raw = JSON.stringify(state);
  return new Promise(resolve => {
    if (tg && tg.CloudStorage) {
      tg.CloudStorage.setItem(STORAGE_KEY, raw, () => resolve());
    } else {
      try { localStorage.setItem(STORAGE_KEY, raw); } catch(e) {}
      resolve();
    }
  });
}

// --- Data ---
// cat: 'sport' (голубой) | 'thesis' (розовый — диссертация/портфолио) | 'english' (салатовый) | 'home' (блёклый)
const DAYS = [
  { key: 'mon', name: 'Понедельник', items: [
    { id:'run', label:'Бег', cat:'sport' },
    { id:'eng', label:'Английский', tag:'к экзамену', cat:'english' },
    { id:'small', label:'Мелкие задачи', cat:'home' },
  ]},
  { key: 'tue', name: 'Вторник', items: [
    { id:'cardio', label:'Кардио-тренировка', cat:'sport' },
    { id:'hair', label:'Мыть голову', cat:'home' },
    { id:'thesis', label:'Диссертация', cat:'thesis' },
  ]},
  { key: 'wed', name: 'Среда', items: [
    { id:'thesis', label:'Диссертация', cat:'thesis' },
    { id:'small', label:'Мелкие задачи', cat:'home' },
  ]},
  { key: 'thu', name: 'Четверг', items: [
    { id:'run', label:'Бег', cat:'sport' },
    { id:'eng', label:'Английский', tag:'к экзамену', cat:'english' },
  ]},
  { key: 'fri', name: 'Пятница', items: [
    { id:'cardio', label:'Кардио-тренировка', cat:'sport' },
    { id:'thesis', label:'Диссертация', cat:'thesis' },
  ]},
  { key: 'sat', name: 'Суббота', items: [
    { id:'longrun', label:'Длинная пробежка', cat:'sport' },
    { id:'hair', label:'Мыть голову', cat:'home' },
    { id:'clean', label:'Уборка', cat:'home' },
    { id:'thesis', label:'Диссертация', cat:'thesis' },
    { id:'small', label:'Мелкие задачи', cat:'home' },
  ]},
  { key: 'sun', name: 'Воскресенье', items: [
    { id:'rest', label:'Прогулка', cat:'home' },
    { id:'portfolio', label:'Портфолио', tag:'1 проект', cat:'thesis' },
  ]},
];

const JS_TO_KEY = ['sun','mon','tue','wed','thu','fri','sat'];
const todayKey = JS_TO_KEY[new Date().getDay()];

let state = {};

function itemKey(dayKey, itemId) {
  return dayKey + ':' + itemId;
}

function render() {
  const week = document.getElementById('week');
  week.innerHTML = '';
  let totalDone = 0, totalItems = 0;

  DAYS.forEach(day => {
    const dayEl = document.createElement('div');
    dayEl.className = 'day' + (day.key === todayKey ? ' today' : '');

    const doneCount = day.items.filter(it => state[itemKey(day.key, it.id)]).length;
    totalDone += doneCount;
    totalItems += day.items.length;

    const head = document.createElement('div');
    head.className = 'day-head';
    const nameHtml = day.key === todayKey
      ? `<span class="day-name">${day.name}<span class="today-dot"></span></span>`
      : `<span class="day-name">${day.name}</span>`;
    head.innerHTML = `${nameHtml}<span class="day-progress">${doneCount}/${day.items.length}</span>`;
    dayEl.appendChild(head);

    const itemsEl = document.createElement('div');
    itemsEl.className = 'items';

    day.items.forEach(it => {
      const key = itemKey(day.key, it.id);
      const done = !!state[key];
      const row = document.createElement('div');
      row.className = 'item cat-' + it.cat + (done ? ' done' : '');
      const dotHtml = (it.cat === 'sport' || it.cat === 'thesis' || it.cat === 'english')
        ? `<span class="cat-dot ${it.cat}"></span>` : '';
      const tagHtml = it.tag ? `<span class="tag tag-${it.cat}">${it.tag}</span>` : '';
      row.innerHTML = `<span class="check"></span><span class="label">${dotHtml}${it.label}${tagHtml}</span>`;
      row.addEventListener('click', async () => {
        state[key] = !state[key];
        if (tg && tg.HapticFeedback) {
          try { tg.HapticFeedback.impactOccurred('light'); } catch(e) {}
        }
        await storageSet(state);
        render();
      });
      itemsEl.appendChild(row);
    });

    dayEl.appendChild(itemsEl);
    week.appendChild(dayEl);
  });

  document.getElementById('week-progress').textContent = `${totalDone} из ${totalItems} выполнено`;
}

document.getElementById('reset-btn').addEventListener('click', async () => {
  state = {};
  await storageSet(state);
  render();
});

document.getElementById('week-range').textContent = getWeekRangeLabel();
document.getElementById('week').innerHTML = '<div class="loading">загрузка…</div>';
storageGet().then(saved => {
  state = saved;
  render();
});
</script>

</body>
</html>
