<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Неделя</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Neucha&family=Nunito+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #f6f1e4;
    --paper-line: #e2d8c1;
    --ink: #33302a;
    --ink-soft: #6b6357;
    --blue: #4a5f7a;
    --blue-soft: #a9bccf;
    --sage: #7c9473;
    --sage-soft: #dfe8da;
    --today-glow: #f0e3c2;
    --card: #fffdf8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(var(--paper) 0px, var(--paper) 27px, var(--paper-line) 28px);
    background-color: var(--paper);
    font-family:'Nunito Sans', sans-serif;
    color: var(--ink);
    padding: 18px 14px 60px;
    min-height:100vh;
  }
  header{
    text-align:center;
    margin: 6px 0 20px;
    position:relative;
  }
  header h1{
    font-family:'Neucha', cursive;
    font-size: 40px;
    margin:0;
    color: var(--blue);
    transform: rotate(-1deg);
    letter-spacing: 0.5px;
  }
  header p{
    font-size:13px;
    color: var(--ink-soft);
    margin: 4px 0 0;
    font-family:'JetBrains Mono', monospace;
  }
  .commute-note{
    max-width: 560px;
    margin: 0 auto 22px;
    background: var(--card);
    border: 1.5px dashed var(--blue-soft);
    border-radius: 14px;
    padding: 10px 16px;
    text-align:center;
    color: var(--blue);
    font-family:'Neucha', cursive;
    font-size: 20px;
  }
  .week{
    max-width: 560px;
    margin: 0 auto;
    display:flex;
    flex-direction:column;
    gap: 14px;
  }
  .day{
    background: var(--card);
    border-radius: 16px;
    padding: 14px 16px 16px;
    box-shadow: 0 1px 0 var(--paper-line), 0 6px 14px -10px rgba(60,50,30,0.35);
    border: 1px solid var(--paper-line);
    position: relative;
  }
  .day.today{
    box-shadow: 0 0 0 2px var(--sage), 0 6px 16px -8px rgba(60,50,30,0.4);
    background: linear-gradient(180deg, var(--today-glow) 0%, var(--card) 55px);
  }
  .day-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom: 10px;
  }
  .day-name{
    font-family:'Neucha', cursive;
    font-size: 26px;
    color: var(--ink);
  }
  .day.today .day-name::after{
    content: " · сегодня";
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--sage);
    vertical-align: middle;
  }
  .day-progress{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .items{
    display:flex;
    flex-direction:column;
    gap: 8px;
  }
  .item{
    display:flex;
    align-items:flex-start;
    gap: 10px;
    cursor:pointer;
    user-select:none;
    padding: 4px 2px;
    border-radius: 8px;
    transition: background 0.15s ease;
  }
  .item:active{
    background: var(--sage-soft);
  }
  .check{
    flex: none;
    width: 24px;
    height: 24px;
    margin-top: 1px;
    border-radius: 50%;
    border: 2.2px solid var(--blue-soft);
    position: relative;
    transition: border-color 0.2s ease, transform 0.15s ease;
  }
  .item.done .check{
    border-color: var(--sage);
    transform: rotate(-6deg) scale(1.04);
  }
  .item.done .check::after{
    content:"";
    position:absolute;
    left: 3px; top: 3px; right: 3px; bottom: 3px;
    border-radius: 50%;
    border: 2px solid var(--sage);
    opacity: 0.9;
  }
  .item.done .check::before{
    content:"✓";
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 13px;
    color: var(--sage);
    font-weight:800;
  }
  .label{
    font-size: 15.5px;
    line-height: 1.3;
    padding-top: 2px;
  }
  .item.done .label{
    color: var(--ink-soft);
    text-decoration: line-through;
    text-decoration-color: var(--sage-soft);
    text-decoration-thickness: 2px;
  }
  .tag{
    display:inline-block;
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--blue);
    background: #eef2f6;
    border-radius: 5px;
    padding: 1px 5px;
    margin-left: 6px;
    vertical-align: middle;
  }
  footer{
    max-width: 560px;
    margin: 22px auto 0;
    text-align:center;
  }
  .reset-btn{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--paper-line);
    border-radius: 20px;
    padding: 8px 16px;
    cursor:pointer;
  }
  .reset-btn:active{
    background: var(--paper-line);
  }
  .loading{
    text-align:center;
    color: var(--ink-soft);
    font-family:'JetBrains Mono', monospace;
    font-size: 13px;
    margin-top: 40px;
  }
</style>
</head>
<body>

<header>
  <h1>Моя неделя</h1>
  <p id="week-progress">загрузка…</p>
</header>

<div class="commute-note">🚗 в дороге всегда: испанский, подкасты</div>

<div class="week" id="week"></div>

<footer>
  <button class="reset-btn" id="reset-btn">сбросить неделю ↺</button>
</footer>

<script>
// --- Telegram Mini App init ---
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor('#f6f1e4'); } catch(e) {}
  try { tg.setBackgroundColor('#f6f1e4'); } catch(e) {}
}

// --- Storage layer: Telegram CloudStorage with localStorage fallback ---
const STORAGE_KEY = 'week-tracker-state';

function storageGet() {
  return new Promise(resolve => {
    if (tg && tg.CloudStorage) {
      tg.CloudStorage.getItem(STORAGE_KEY, (err, value) => {
        if (err || !value) { resolve({}); return; }
        try { resolve(JSON.parse(value)); } catch(e) { resolve({}); }
      });
    } else {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        resolve(raw ? JSON.parse(raw) : {});
      } catch(e) { resolve({}); }
    }
  });
}

function storageSet(state) {
  const raw = JSON.stringify(state);
  return new Promise(resolve => {
    if (tg && tg.CloudStorage) {
      tg.CloudStorage.setItem(STORAGE_KEY, raw, () => resolve());
    } else {
      try { localStorage.setItem(STORAGE_KEY, raw); } catch(e) {}
      resolve();
    }
  });
}

// --- Data ---
const DAYS = [
  { key: 'mon', name: 'Понедельник', items: [
    { id:'run', label:'Бег' },
    { id:'eng', label:'Английский', tag:'повторение' },
    { id:'small', label:'Мелкие задачи' },
  ]},
  { key: 'tue', name: 'Вторник', items: [
    { id:'cardio', label:'Кардио' },
    { id:'hair', label:'Мыть голову' },
    { id:'thesis', label:'Диссертация' },
  ]},
  { key: 'wed', name: 'Среда', items: [
    { id:'rest', label:'Отдых' },
    { id:'thesis', label:'Диссертация' },
    { id:'small', label:'Мелкие задачи' },
  ]},
  { key: 'thu', name: 'Четверг', items: [
    { id:'run', label:'Бег' },
    { id:'eng', label:'Английский', tag:'повторение' },
  ]},
  { key: 'fri', name: 'Пятница', items: [
    { id:'cardio', label:'Кардио' },
    { id:'thesis', label:'Диссертация' },
  ]},
  { key: 'sat', name: 'Суббота', items: [
    { id:'longrun', label:'Длинная пробежка' },
    { id:'hair', label:'Мыть голову' },
    { id:'clean', label:'Уборка' },
    { id:'thesis', label:'Диссертация' },
    { id:'small', label:'Мелкие задачи' },
  ]},
  { key: 'sun', name: 'Воскресенье', items: [
    { id:'rest', label:'Отдых, гулять' },
    { id:'portfolio', label:'Портфолио', tag:'1 проект' },
  ]},
];

const JS_TO_KEY = ['sun','mon','tue','wed','thu','fri','sat'];
const todayKey = JS_TO_KEY[new Date().getDay()];

let state = {};

function itemKey(dayKey, itemId) {
  return dayKey + ':' + itemId;
}

function render() {
  const week = document.getElementById('week');
  week.innerHTML = '';
  let totalDone = 0, totalItems = 0;

  DAYS.forEach(day => {
    const dayEl = document.createElement('div');
    dayEl.className = 'day' + (day.key === todayKey ? ' today' : '');

    const doneCount = day.items.filter(it => state[itemKey(day.key, it.id)]).length;
    totalDone += doneCount;
    totalItems += day.items.length;

    const head = document.createElement('div');
    head.className = 'day-head';
    head.innerHTML = `<span class="day-name">${day.name}</span><span class="day-progress">${doneCount}/${day.items.length}</span>`;
    dayEl.appendChild(head);

    const itemsEl = document.createElement('div');
    itemsEl.className = 'items';

    day.items.forEach(it => {
      const key = itemKey(day.key, it.id);
      const done = !!state[key];
      const row = document.createElement('div');
      row.className = 'item' + (done ? ' done' : '');
      row.innerHTML = `<span class="check"></span><span class="label">${it.label}${it.tag ? `<span class="tag">${it.tag}</span>` : ''}</span>`;
      row.addEventListener('click', async () => {
        state[key] = !state[key];
        if (tg && tg.HapticFeedback) {
          try { tg.HapticFeedback.impactOccurred('light'); } catch(e) {}
        }
        await storageSet(state);
        render();
      });
      itemsEl.appendChild(row);
    });

    dayEl.appendChild(itemsEl);
    week.appendChild(dayEl);
  });

  document.getElementById('week-progress').textContent = `выполнено ${totalDone} из ${totalItems}`;
}

document.getElementById('reset-btn').addEventListener('click', async () => {
  state = {};
  await storageSet(state);
  render();
});

document.getElementById('week').innerHTML = '<div class="loading">загрузка…</div>';
storageGet().then(saved => {
  state = saved;
  render();
});
</script>

</body>
</html>
